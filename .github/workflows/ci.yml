name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancela execuções antigas da mesma branch quando um novo push chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 é o piso declarado em engines/.nvmrc; 24 antecipa a próxima LTS.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar
        run: npm run validate

      - name: Publicar relatório de cobertura
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Roda apenas no CI: uma falha aqui indica vulnerabilidade publicada,
      # não um erro de código. Manter fora do `validate` evita travar o
      # trabalho local por indisponibilidade do registry.
      - name: Auditar vulnerabilidades
        run: npm audit --audit-level=high
